<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Building Chat</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                💬
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to Building Group Chat
            </p>

            <form id="loginForm">

                <!-- Email or Phone -->
                <div class="input-group">

                    <label for="loginId">
                        Email or Phone Number
                    </label>

                    <input
                        type="text"
                        id="loginId"
                        name="loginId"
                        placeholder="Enter email or phone number"
                        autocomplete="username"
                    >

                    <small id="loginIdError"></small>

                </div>

                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Login
                </button>

            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="../signup/signup.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
